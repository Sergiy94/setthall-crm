<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sett.hall - CRM Прокату</title>
  
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8835/8835848.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .dark-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark-scroll::-webkit-scrollbar-track { background: #020617; }
    .dark-scroll::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 4px; }
    
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    
    .print-only { display: none; }
    @media print {
      body * { visibility: hidden; }
      .print-only, .print-only * { visibility: visible; }
      .print-only { 
        display: block; position: absolute; left: 0; top: 0; width: 100%; 
        background: white; color: black; 
      }
      @page { margin: 0; }
    }
  </style>

  <!-- PWA Manifest -->
  <script type="application/json" id="manifest">
    {
      "name": "Sett.hall Прокат",
      "short_name": "Прокат CRM",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#0f172a",
      "theme_color": "#ea580c",
      "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/8835/8835848.png", "sizes": "512x512", "type": "image/png"}]
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ВАШЕ АКТУАЛЬНЕ ПОСИЛАННЯ НА GOOGLE APPS SCRIPT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZl1k_mz9sp_5KFWw8NkmHpuZca5ZEmFuQB9ZW7pBN-pUx-rrT98yuIMZpYIZZ9CwRGQ/exec';

    function App() {
      const [isAuth, setIsAuth] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [login, setLogin] = useState('');
      const [password, setPassword] = useState('');
      const [toast, setToast] = useState(null);
      
      const [activeTab, setActiveTab] = useState('rentals');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false); 
      
      const [fopData, setFopData] = useState({ name: '', rnokpp: '', address: '', iban: '', phone: '' });
      const [clients, setClients] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [rentals, setRentals] = useState([]);
      const [requests, setRequests] = useState([]); // ДОДАНО: Стейт для заявок

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // --- УНІВЕРСАЛЬНА ФУНКЦІЯ ДЛЯ ЗАПИТІВ НА БЕКЕНД ---
      const apiCall = async (payload) => {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          return await res.json();
        } catch (error) {
          console.error("API Error:", error);
          throw error;
        }
      };

      const parseData = (data) => {
        if (data.settings) {
          setFopData(prev => ({ ...prev, ...data.settings }));
        }
        if (data.clients) setClients(data.clients);
        if (data.inventory) setInventory(data.inventory);
        if (data.requests) setRequests(data.requests); // ДОДАНО: Парсинг заявок
        if (data.rentals) {
          setRentals(data.rentals.map(r => ({
            ...r,
            bikeIds: Array.isArray(r.bikeIds) ? r.bikeIds : (typeof r.bikeIds === 'string' ? JSON.parse(r.bikeIds || '[]') : [])
          })));
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          const result = await apiCall({ action: 'login', username: login, password: password });
          
          if (result.status === 'success') {
            setIsAuth(true);
            parseData(result.data);
            showToast('Успішний вхід!');
          } else {
            showToast(result.message || 'Невірний логін або пароль!', 'error');
          }
        } catch (error) {
          showToast('Помилка підключення до бази (перевірте URL)!', 'error');
        }
        setIsLoading(false);
      };

      const syncData = async () => {
        showToast('Синхронізація...', 'success');
        try {
          const result = await apiCall({ action: 'sync' });
          if (result.status === 'success') {
            parseData(result.data);
            showToast('Дані оновлено!');
          }
        } catch (error) {
          showToast('Помилка синхронізації', 'error');
        }
      };

      const saveToDB = async (action, record) => {
        try {
          await apiCall({ action, record });
        } catch (e) {
          showToast('Помилка збереження на сервері!', 'error');
        }
      };

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setIsMobileMenuOpen(false); 
      };

      // --- ДРУК (Акти та Договори) ---
      const printDoc = (html, mode) => {
        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '1px';
        iframe.style.height = '1px';
        iframe.style.border = 'none';
        iframe.style.opacity = '0';
        iframe.style.zIndex = '-1';
        document.body.appendChild(iframe);
        
        const doc = iframe.contentWindow.document;
        const styles = mode === 'a4' 
          ? `<style>
              @page { margin: 15mm; } 
              body { font-family: 'Times New Roman', serif; font-size: 13px; line-height: 1.4; text-align: justify; color: black; background: white; margin: 0; padding: 0; } 
              h1 { text-align: center; font-size: 16px; margin: 15px 0 10px 0; font-weight: bold; }
              h2 { text-align: center; font-size: 14px; margin: 15px 0 5px 0; font-weight: bold; text-transform: uppercase; }
              h3 { text-align: center; font-size: 13px; font-weight: bold; margin: 10px 0; }
              p { margin: 0 0 8px 0; }
              ul { margin: 5px 0 10px 0; padding-left: 20px; }
              li { margin-bottom: 5px; }
              table { width: 100%; border-collapse: collapse; margin: 15px 0; page-break-inside: avoid; } 
              td, th { border: 1px solid black; padding: 6px; text-align: left; } 
              .no-border-table { border: none; }
              .no-border-table td, .no-border-table th { border: none; padding: 2px 5px; }
              .page-break { page-break-before: always; }
              .no-break { page-break-inside: avoid; }
            </style>`
          : `<style>
              @page { margin: 0; } 
              body { 
                width: 58mm; 
                margin: 0; 
                padding: 2mm 4mm 2mm 0mm; 
                font-family: 'Courier New', Courier, monospace; 
                font-size: 11px; 
                line-height: 1.2; 
                text-align: left; 
                color: black; 
                background: white; 
                word-wrap: break-word; 
              } 
              h1, h2, h3 { text-align: center; margin: 4px 0; font-size: 12px; font-weight: bold; } 
              hr { border-top: 1px dashed black; border-bottom: none; margin: 5px 0; }
              .center { text-align: center; }
              .bold { font-weight: bold; }
            </style>`;
        
        doc.open();
        doc.write(`<html><head>${styles}</head><body>${html}</body></html>`);
        doc.close();
        
        setTimeout(() => { 
          try {
            iframe.contentWindow.focus(); 
            iframe.contentWindow.print(); 
          } catch(e) {
            console.error("Помилка друку:", e);
          }
          setTimeout(() => iframe.remove(), 1500); 
        }, 500);
      };

      if (!isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
            <form onSubmit={handleLogin} className="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl w-full max-w-sm shadow-2xl border border-orange-500/30">
              <div className="flex justify-center mb-6">
                <div className="w-16 h-16 bg-gradient-to-br from-orange-500 to-rose-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-orange-600/40">
                  <i data-lucide="activity" className="w-8 h-8"></i>
                </div>
              </div>
              <h1 className="text-2xl font-black mb-1 text-center text-white">Sett.hall CRM</h1>
              <p className="text-slate-400 text-sm text-center mb-6">Оренда транспорту</p>
              
              <input type="text" value={login} onChange={e=>setLogin(e.target.value)} placeholder="Логін" required className="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl mb-4 text-white outline-none focus:border-orange-500 transition-colors" />
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Пароль" required className="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl mb-6 text-white outline-none focus:border-orange-500 transition-colors" />
              
              <button type="submit" disabled={isLoading} className="w-full bg-gradient-to-r from-orange-600 to-rose-600 hover:from-orange-500 hover:to-rose-500 text-white py-4 rounded-xl font-black shadow-lg shadow-orange-600/30 transition-all flex justify-center items-center gap-2">
                {isLoading ? 'Завантаження...' : 'Увійти в систему'}
              </button>
            </form>
            {toast && <div className={`fixed top-4 right-4 px-6 py-3 rounded-xl font-bold shadow-xl toast-animate z-50 ${toast.type==='error'?'bg-rose-500':'bg-emerald-500'} text-white`}>{toast.msg}</div>}
          </div>
        );
      }

      // ДОДАНО: Підрахунок нових заявок для бейджика в меню
      const newRequestsCount = requests.filter(r => r.status === 'new').length;

      return (
        <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-slate-950 w-full relative">
          {toast && <div className={`fixed top-4 right-4 px-6 py-3 rounded-xl font-bold shadow-xl toast-animate z-50 ${toast.type==='error'?'bg-rose-500':'bg-emerald-500'} text-white`}>{toast.msg}</div>}

          {/* MOBILE HEADER */}
          <div className="md:hidden bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center z-40 shrink-0 shadow-md">
            <div className="flex items-center gap-3 font-black text-xl text-white">
              <div className="bg-gradient-to-br from-orange-500 to-rose-600 p-2 rounded-lg">
                <i data-lucide="bike" className="w-5 h-5 text-white"></i>
              </div>
              Sett.hall
            </div>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-white transition-colors relative">
              {newRequestsCount > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 bg-rose-500 rounded-full"></span>}
              <i data-lucide={isMobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
            </button>
          </div>

          {/* SIDEBAR */}
          <nav className={`
            ${isMobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'} 
            md:translate-x-0 
            fixed md:relative 
            top-[73px] md:top-0 left-0 
            w-full sm:w-80 md:w-64 
            h-[calc(100vh-73px)] md:h-full 
            bg-slate-900 flex flex-col border-r border-slate-800 shrink-0 
            z-30 transition-transform duration-300 ease-in-out
          `}>
            <div className="hidden md:flex p-6 font-black text-2xl text-white border-b border-slate-800 justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-br from-orange-500 to-rose-600 p-2 rounded-lg"><i data-lucide="bike" className="w-6 h-6 text-white"></i></div>
                Sett.hall
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-2 dark-scroll">
              <MenuBtn active={activeTab==='rentals'} onClick={()=>handleTabChange('rentals')} icon="play" label="Видача / В прокаті" />
              
              {/* ДОДАНО: Кнопка заявок з бейджиком */}
              <button onClick={()=>handleTabChange('requests')} className={`flex items-center justify-between text-left px-4 py-3.5 rounded-xl font-bold transition-all ${activeTab==='requests' ? 'bg-gradient-to-r from-orange-600 to-rose-600 text-white shadow-lg shadow-orange-600/20' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <div className="flex items-center gap-3"><i data-lucide="inbox" className="w-5 h-5"></i> Заявки з сайту</div>
                {newRequestsCount > 0 && <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full">{newRequestsCount}</span>}
              </button>

              <MenuBtn active={activeTab==='history'} onClick={()=>handleTabChange('history')} icon="history" label="Історія Прокатів" />
              <MenuBtn active={activeTab==='clients'} onClick={()=>handleTabChange('clients')} icon="users" label="База Клієнтів" />
              <MenuBtn active={activeTab==='inventory'} onClick={()=>handleTabChange('inventory')} icon="box" label="Парк Транспорту" />
              <MenuBtn active={activeTab==='settings'} onClick={()=>handleTabChange('settings')} icon="settings" label="Налаштування" />
            </div>
            <div className="p-4 border-t border-slate-800 bg-slate-900">
               <button onClick={syncData} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold transition-colors">
                  <i data-lucide="refresh-cw" className="w-4 h-4"></i> Оновити дані
               </button>
            </div>
          </nav>

          {/* OVERLAY FOR MOBILE MENU */}
          {isMobileMenuOpen && (
            <div onClick={() => setIsMobileMenuOpen(false)} className="md:hidden fixed inset-0 top-[73px] bg-slate-950/60 backdrop-blur-sm z-20"></div>
          )}

          {/* MAIN CONTENT */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 dark-scroll relative w-full max-w-full">
            {activeTab === 'rentals' && <RentalsView rentals={rentals} clients={clients} inventory={inventory} setRentals={setRentals} setInventory={setInventory} fopData={fopData} printDoc={printDoc} saveToDB={saveToDB} showToast={showToast} />}
            {activeTab === 'requests' && <RequestsView requests={requests} setRequests={setRequests} saveToDB={saveToDB} showToast={showToast} />} {/* ДОДАНО: Компонент заявок */}
            {activeTab === 'history' && <HistoryView rentals={rentals} clients={clients} inventory={inventory} fopData={fopData} printDoc={printDoc} />}
            {activeTab === 'clients' && <ClientsView clients={clients} setClients={setClients} fopData={fopData} printDoc={printDoc} saveToDB={saveToDB} showToast={showToast} />}
            {activeTab === 'inventory' && <InventoryView inventory={inventory} setInventory={setInventory} saveToDB={saveToDB} showToast={showToast} />}
            {activeTab === 'settings' && <SettingsView fopData={fopData} setFopData={setFopData} apiCall={apiCall} showToast={showToast} />}
          </main>
        </div>
      );
    }

    const MenuBtn = ({active, label, icon, onClick}) => {
      useEffect(() => { lucide.createIcons(); });
      return (
        <button onClick={onClick} className={`flex items-center gap-3 text-left px-4 py-3.5 rounded-xl font-bold transition-all ${active ? 'bg-gradient-to-r from-orange-600 to-rose-600 text-white shadow-lg shadow-orange-600/20' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
          <i data-lucide={icon} className="w-5 h-5"></i> {label}
        </button>
      );
    };

    // ==========================================
    // НОВИЙ РОЗДІЛ: ЗАЯВКИ З САЙТУ
    // ==========================================
    function RequestsView({ requests, setRequests, saveToDB, showToast }) {
      useEffect(() => { lucide.createIcons(); });
      
      const [filter, setFilter] = useState('new'); // new, processed, all

      const updateStatus = (req, newStatus) => {
        const updated = { ...req, status: newStatus };
        setRequests(requests.map(r => r.id === req.id ? updated : r));
        saveToDB('update_request', updated);
        showToast(newStatus === 'processed' ? 'Заявку оброблено!' : 'Заявку скасовано');
      };

      const filteredRequests = requests
        .filter(r => filter === 'all' ? true : r.status === filter)
        .sort((a, b) => new Date(b.dateSubmitted) - new Date(a.dateSubmitted));

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl gap-4">
            <div>
              <h1 className="text-3xl font-black text-white flex items-center gap-3">
                Заявки з сайту
                {requests.filter(r => r.status === 'new').length > 0 && (
                  <span className="bg-rose-500 text-white text-sm px-3 py-1 rounded-full">{requests.filter(r => r.status === 'new').length} нових</span>
                )}
              </h1>
              <p className="text-slate-400 mt-1">Керування запитами від клієнтів з лендінгу</p>
            </div>
            
            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 w-full md:w-auto">
              <button onClick={()=>setFilter('new')} className={`flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-colors ${filter === 'new' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}`}>Нові</button>
              <button onClick={()=>setFilter('processed')} className={`flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-colors ${filter === 'processed' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}`}>Оброблені</button>
              <button onClick={()=>setFilter('all')} className={`flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-colors ${filter === 'all' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}`}>Всі</button>
            </div>
          </div>

          <div className="space-y-4">
            {filteredRequests.map(req => (
              <div key={req.id} className={`p-6 rounded-3xl border transition-colors shadow-lg relative overflow-hidden ${req.status === 'new' ? 'bg-slate-900 border-orange-500/40' : 'bg-slate-900/50 border-slate-800'}`}>
                {req.status === 'new' && <div className="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>}
                {req.status === 'processed' && <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>}
                
                <div className="flex flex-col md:flex-row justify-between gap-6">
                  <div className="space-y-4 flex-1">
                    <div className="flex flex-wrap items-center gap-3">
                      <h3 className="text-xl font-black text-white">{req.name}</h3>
                      <a href={`tel:${req.phone}`} className="text-indigo-400 font-mono font-bold hover:underline bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/20">{req.phone}</a>
                      <span className="text-xs text-slate-500">Створено: {new Date(req.dateSubmitted).toLocaleString('uk-UA')}</span>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800/50">
                      <div>
                        <div className="text-xs text-slate-500 font-bold uppercase mb-1">Бажана дата</div>
                        <div className="text-white font-medium">{req.desiredDate ? new Date(req.desiredDate).toLocaleDateString('uk-UA') : 'Не вказано'}</div>
                      </div>
                      <div>
                        <div className="text-xs text-slate-500 font-bold uppercase mb-1">Кількість</div>
                        <div className="text-white font-medium">{req.quantity || '1'} од.</div>
                      </div>
                      <div className="col-span-2">
                        <div className="text-xs text-slate-500 font-bold uppercase mb-1">Побажання</div>
                        <div className="text-slate-300 italic">{req.notes || 'Без додаткових побажань'}</div>
                      </div>
                    </div>
                  </div>

                  <div className="flex md:flex-col gap-2 justify-end min-w-[140px]">
                    {req.status === 'new' ? (
                      <>
                        <button onClick={() => updateStatus(req, 'processed')} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-xl font-bold flex justify-center items-center gap-2 transition-colors"><i data-lucide="check" className="w-4 h-4"></i> Оброблено</button>
                        <button onClick={() => updateStatus(req, 'rejected')} className="flex-1 bg-slate-800 hover:bg-slate-700 text-rose-400 px-4 py-3 rounded-xl font-bold flex justify-center items-center gap-2 transition-colors"><i data-lucide="x" className="w-4 h-4"></i> Скасувати</button>
                      </>
                    ) : (
                      <div className={`flex justify-center items-center gap-2 p-3 rounded-xl font-bold ${req.status === 'processed' ? 'text-emerald-500 bg-emerald-500/10' : 'text-rose-500 bg-rose-500/10'}`}>
                        {req.status === 'processed' ? <><i data-lucide="check-circle" className="w-5 h-5"></i> Виконано</> : <><i data-lucide="x-circle" className="w-5 h-5"></i> Скасовано</>}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
            
            {filteredRequests.length === 0 && (
              <div className="text-slate-500 text-center p-12 bg-slate-900/40 rounded-3xl border border-slate-800 border-dashed font-medium">
                Немає заявок у цій категорії.
              </div>
            )}
          </div>
        </div>
      );
    }


    // ==========================================
    // 1. ВИДАЧА ТА В ПРОКАТІ
    // ==========================================
    function RentalsView({ rentals, clients, inventory, setRentals, setInventory, fopData, printDoc, saveToDB, showToast }) {
      const [showIssue, setShowIssue] = useState(false);
      const [showReturn, setShowReturn] = useState(null);
      const [showEdit, setShowEdit] = useState(null);
      
      const [clientSearch, setClientSearch] = useState('');
      const [issueData, setIssueData] = useState({ clientId: '', bikeIds: [], deposit: '', price: '', startTime: new Date().toISOString().slice(0, 16), endTime: '' });
      const [returnData, setReturnData] = useState({ damageNote: '', fine: 0 });

      const activeRentals = rentals.filter(r => r.status === 'active').sort((a,b) => new Date(b.startTime) - new Date(a.startTime));

      useEffect(() => { lucide.createIcons(); });

      const toggleBike = (id) => setIssueData(prev => ({ ...prev, bikeIds: prev.bikeIds.includes(id) ? prev.bikeIds.filter(b => b !== id) : [...prev.bikeIds, id] }));

      const handleIssue = (e) => {
        e.preventDefault();
        if (!issueData.clientId || issueData.bikeIds.length === 0 || !issueData.price) return showToast("Оберіть клієнта, транспорт та вкажіть ціну!", 'error');
        
        const rId = `R-${Date.now().toString().slice(-4)}`;
        const newRental = { id: rId, ...issueData, status: 'active', fine: 0, actualEndTime: '', damageNote: '' };
        
        setRentals([newRental, ...rentals]);
        saveToDB('save_rental', newRental);
        
        const updatedInventory = inventory.map(b => {
          if (issueData.bikeIds.includes(b.id)) {
            const ub = { ...b, status: 'rented' };
            saveToDB('update_inventory', ub);
            return ub;
          }
          return b;
        });
        setInventory(updatedInventory);

        setShowIssue(false);
        setIssueData({ clientId: '', bikeIds: [], deposit: '', price: '', startTime: new Date().toISOString().slice(0, 16), endTime: '' });
        showToast('Транспорт видано!');
      };

      const handleReturn = (e) => {
        e.preventDefault();
        const rental = rentals.find(r => r.id === showReturn);
        const actualEndTime = new Date().toISOString();
        const updatedRental = { ...rental, status: 'completed', actualEndTime, damageNote: returnData.damageNote, fine: returnData.fine };

        setRentals(rentals.map(r => r.id === showReturn ? updatedRental : r));
        saveToDB('update_rental', updatedRental);

        const updatedInventory = inventory.map(b => {
          if (rental.bikeIds.includes(b.id)) {
            const ub = { ...b, status: 'available' };
            saveToDB('update_inventory', ub);
            return ub;
          }
          return b;
        });
        setInventory(updatedInventory);

        setShowReturn(null);
        setReturnData({ damageNote: '', fine: 0 });
        showToast('Оренду завершено!');
      };

      const handleEdit = (e) => {
        e.preventDefault();
        const oldRental = rentals.find(r => r.id === showEdit.id);
        
        setRentals(rentals.map(r => r.id === showEdit.id ? showEdit : r));
        saveToDB('update_rental', showEdit);
        
        const newInventory = inventory.map(b => {
          const wasInRental = oldRental.bikeIds.includes(b.id);
          const isInRentalNow = showEdit.bikeIds.includes(b.id);
          
          if (wasInRental && !isInRentalNow) {
            const ub = { ...b, status: 'available' };
            saveToDB('update_inventory', ub);
            return ub;
          } else if (!wasInRental && isInRentalNow) {
            const ub = { ...b, status: 'rented' };
            saveToDB('update_inventory', ub);
            return ub;
          }
          return b;
        });
        setInventory(newInventory);
        
        setShowEdit(null);
        showToast('Оренду оновлено!');
      };

      const printAct = (rentalId, mode) => {
        const rental = rentals.find(x => x.id === rentalId);
        const client = clients.find(c => c.id === rental.clientId) || {};
        const rentedBikes = inventory.filter(b => rental.bikeIds.includes(b.id));
        const totalValue = rentedBikes.reduce((sum, b) => sum + Number(b.value), 0);
        
        const contractBase = client.contractType === 'electronic' 
          ? `Публічного договору прокату (Оферти)`
          : `Договору прокату № П-${String(client.id || '').slice(-4)}`;

        let bikesHtml = rentedBikes.map(b => `<tr><td>${b.type} ${b.model}</td><td>${b.serial}</td><td>${b.value} грн</td></tr>`).join('');

        let html = mode === 'a4' ? `
          <div style="text-align: right; font-size: 11px;">Додаток до ${contractBase}</div>
          <h2>АКТ ПРИЙМАННЯ-ПЕРЕДАЧІ № ${rental.id}</h2>
          <p><strong>Видача:</strong> ${new Date(rental.startTime).toLocaleString('uk-UA')} ${rental.endTime ? `| <strong>Заплановане повернення:</strong> ${new Date(rental.endTime).toLocaleString('uk-UA')}` : ''}</p>
          <table>
            <tr><th>Транспорт</th><th>Серійний №</th><th>Оголошена вартість</th></tr>
            ${bikesHtml}
            <tr><th colspan="2" style="text-align: right;">Загальна оголошена вартість:</th><th>${totalValue} грн</th></tr>
          </table>
          <p><strong>Вартість прокату:</strong> ${rental.price} грн | <strong>Застава:</strong> ${rental.deposit || 'Без застави'}</p>
          <div class="no-break">
            <p>Підписуючи цей Акт приймання-передачі, Орендар підтверджує, що він оглянув Майно та переконався в його повній технічній справності, пройшов Інструктаж з техніки безпеки, розуміє правила техніки безпеки та зобов'язується їх неухильно виконувати. У разі втрати, крадіжки або знищення майна, Орендар зобов'язується виплатити Загальну оголошену вартість протягом 3 (трьох) днів.</p>
            <table class="no-border-table" style="margin-top: 30px;">
              <tr>
                <td style="width: 50%;"><b>Орендодавець:</b><br/>${fopData.name}<br/>ІПН: ${fopData.rnokpp}<br/>Тел: ${fopData.phone}<br/><br/>Підпис: _________</td>
                <td style="width: 50%;"><b>Орендар:</b><br/>${client.name}<br/>Документ: ${client.docType} ${client.docNumber}<br/>Тел: ${client.phone}<br/><br/>Підпис: _________</td>
              </tr>
            </table>
          </div>
        ` : `
          <h3 class="center">АКТ ПРИЙМАННЯ</h3>
          <div class="center" style="margin-bottom: 5px;">№ ${rental.id}</div>
          <div>Підстава: <br/>${client.contractType==='electronic'?'Е-Оферта':`Договір № П-${String(client.id || '').slice(-4)}`}</div>
          <div>Клієнт: ${client.name}</div>
          <div>Видача:<br/>${new Date(rental.startTime).toLocaleString('uk-UA').replace(',', '')}</div>
          <hr/>
          ${rentedBikes.map(b => `<div style="margin-bottom:4px;"><span class="bold">${b.model}</span><br/>SN: ${b.serial}<br/>Оцінка: ${b.value} ₴</div>`).join('')}
          <hr/>
          <div>Оцінка заг.: ${totalValue} ₴</div>
          <div class="bold" style="font-size: 13px; margin: 4px 0;">Оплата: ${rental.price} ₴</div>
          <div>Застава: ${rental.deposit || '-'}</div>
          <hr/>
          <div style="font-size: 9px; text-align: justify; margin: 5px 0;">
            Підписуючи цей Акт, Орендар підтверджує, що оглянув Майно, пройшов Інструктаж з ТБ та переконався в його справності. У разі втрати Орендар сплачує Оголошену вартість.
          </div>
          <br/>
          <div>Підпис: ______________</div>
        `;
        printDoc(html, mode);
      };

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl gap-4">
            <div><h1 className="text-3xl font-black text-white">Панель Видачі</h1><p className="text-slate-400 mt-1">Оформлення нових прокатів</p></div>
            <button onClick={() => {setShowIssue(!showIssue); setIssueData({ clientId: '', bikeIds: [], deposit: '', price: '', startTime: new Date().toISOString().slice(0, 16), endTime: '' });}} className="w-full md:w-auto bg-gradient-to-r from-orange-600 to-rose-600 hover:from-orange-500 hover:to-rose-500 px-6 py-3.5 rounded-xl font-bold flex justify-center items-center gap-2 text-white shadow-lg transition-all"><i data-lucide="plus-circle" className="w-5 h-5"></i> Видати Транспорт</button>
          </div>

          {showIssue && (
            <form onSubmit={handleIssue} className="bg-slate-900 border border-slate-700 p-5 md:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95 duration-200">
              <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="file-signature" className="text-orange-500"></i> Новий Акт Оренди</h2>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8">
                <div className="space-y-6">
                  <div className="bg-slate-950 p-4 md:p-5 rounded-2xl border border-slate-800">
                    <label className="text-xs text-orange-400 font-bold uppercase mb-2 block">1. Клієнт</label>
                    <input value={clientSearch} onChange={e=>setClientSearch(e.target.value)} placeholder="Пошук (ім'я або телефон)..." className="w-full bg-slate-900 border border-slate-700 p-3.5 rounded-xl mb-3 text-white outline-none focus:border-orange-500" />
                    <div className="max-h-40 overflow-y-auto space-y-1 dark-scroll">
                      {clients.filter(c => c.name.toLowerCase().includes(clientSearch.toLowerCase()) || c.phone.includes(clientSearch)).slice(0,10).map(c => (
                        <div key={c.id} onClick={() => setIssueData({...issueData, clientId: c.id})} className={`p-3 rounded-xl cursor-pointer font-medium transition-colors ${issueData.clientId === c.id ? 'bg-orange-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>
                          {c.name} <span className="text-xs opacity-70 ml-2">({c.phone})</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="bg-slate-950 p-4 md:p-5 rounded-2xl border border-slate-800">
                    <label className="text-xs text-orange-400 font-bold uppercase mb-2 block">2. Транспорт (Можна кілька)</label>
                    <div className="max-h-48 overflow-y-auto space-y-2 dark-scroll">
                      {inventory.filter(b => b.status === 'available').map(b => (
                        <label key={b.id} className="flex items-center gap-3 p-3 bg-slate-900 hover:bg-slate-800 rounded-xl cursor-pointer border border-slate-800 transition-colors">
                          <input type="checkbox" checked={issueData.bikeIds.includes(b.id)} onChange={() => toggleBike(b.id)} className="w-5 h-5 accent-orange-500 rounded" />
                          <div className="flex-1 text-sm font-bold text-white">[{b.id}] {b.model}</div>
                          <div className="text-xs font-mono text-slate-400">{b.value} ₴</div>
                        </label>
                      ))}
                      {inventory.filter(b => b.status === 'available').length === 0 && <div className="text-slate-500 text-center py-4">Немає вільного транспорту</div>}
                    </div>
                  </div>
                </div>
                <div className="space-y-6">
                  <div className="bg-slate-950 p-4 md:p-5 rounded-2xl border border-slate-800 space-y-4">
                    <label className="text-xs text-orange-400 font-bold uppercase block">3. Час та Фінанси</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div><span className="text-xs text-slate-500 font-semibold mb-1 block">Початок</span><input type="datetime-local" value={issueData.startTime} onChange={e=>setIssueData({...issueData, startTime: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-white outline-none" /></div>
                      <div><span className="text-xs text-slate-500 font-semibold mb-1 block">План. Повернення</span><input type="datetime-local" value={issueData.endTime} onChange={e=>setIssueData({...issueData, endTime: e.target.value})} className="w-full bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-white outline-none" /></div>
                    </div>
                    <div><span className="text-xs text-slate-500 font-semibold mb-1 block">Застава (документ/кошти)</span><input value={issueData.deposit} onChange={e=>setIssueData({...issueData, deposit: e.target.value})} placeholder="Що залишив клієнт?" className="w-full bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                    <div><span className="text-xs text-emerald-400 font-bold mb-1 block">Вартість до сплати (грн)</span><input required type="number" value={issueData.price} onChange={e=>setIssueData({...issueData, price: e.target.value})} placeholder="0.00" className="w-full bg-emerald-950/20 border-2 border-emerald-900/50 p-4 rounded-xl text-emerald-400 font-black text-2xl outline-none focus:border-emerald-500" /></div>
                  </div>
                </div>
              </div>
              <div className="mt-8 flex flex-col-reverse sm:flex-row justify-end gap-3 pt-6 border-t border-slate-800">
                <button type="button" onClick={()=>setShowIssue(false)} className="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">Скасувати</button>
                <button type="submit" className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-black text-white shadow-lg shadow-emerald-600/30 transition-all flex justify-center items-center gap-2"><i data-lucide="check-circle" className="w-5 h-5"></i> Видати</button>
              </div>
            </form>
          )}

          {showReturn && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <form onSubmit={handleReturn} className="bg-slate-900 border border-slate-700 p-6 md:p-8 rounded-3xl w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto dark-scroll">
                <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3"><div className="p-2 bg-rose-500/20 rounded-xl"><i data-lucide="corner-down-left" className="text-rose-500"></i></div> Повернення Майна</h2>
                <div className="space-y-5">
                  <div><label className="text-xs text-slate-400 font-bold uppercase mb-2 block">Опис пошкоджень (якщо є)</label><textarea value={returnData.damageNote} onChange={e=>setReturnData({...returnData, damageNote: e.target.value})} placeholder="Наприклад: подряпина на рамі..." className="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white outline-none focus:border-rose-500" rows="3"></textarea></div>
                  <div><label className="text-xs text-rose-400 font-bold uppercase mb-2 block">Штраф / Доплата (грн)</label><input type="number" value={returnData.fine} onChange={e=>setReturnData({...returnData, fine: e.target.value})} placeholder="0" className="w-full bg-rose-950/20 border-2 border-rose-900/50 p-4 rounded-xl text-rose-400 font-black text-2xl outline-none focus:border-rose-500" /></div>
                </div>
                <div className="mt-8 flex flex-col-reverse sm:flex-row justify-end gap-3">
                  <button type="button" onClick={()=>setShowReturn(null)} className="w-full sm:w-auto px-5 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">Скасувати</button>
                  <button type="submit" className="w-full sm:w-auto bg-rose-600 hover:bg-rose-500 px-6 py-3 rounded-xl font-black text-white shadow-lg shadow-rose-600/30 transition-all">Закрити Оренду</button>
                </div>
              </form>
            </div>
          )}

          {showEdit && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <form onSubmit={handleEdit} className="bg-slate-900 border border-orange-500/30 p-6 md:p-8 rounded-3xl w-full max-w-lg shadow-2xl animate-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto dark-scroll">
                <h2 className="text-2xl font-black text-white mb-6">Редагування Оренди {showEdit.id}</h2>
                <div className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 font-bold block mb-1">Транспорт (ID через кому)</label>
                    <div className="max-h-32 overflow-y-auto bg-slate-950 p-2 rounded-xl border border-slate-700 dark-scroll">
                      {inventory.map(b => (
                         <label key={b.id} className="flex items-center gap-2 p-2 hover:bg-slate-800 rounded cursor-pointer">
                            <input type="checkbox" checked={showEdit.bikeIds.includes(b.id)} onChange={(e) => {
                               const newIds = e.target.checked ? [...showEdit.bikeIds, b.id] : showEdit.bikeIds.filter(id => id !== b.id);
                               setShowEdit({...showEdit, bikeIds: newIds});
                            }} className="w-5 h-5 accent-orange-500" />
                            <span className="text-sm text-white">[{b.id}] {b.model}</span>
                         </label>
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label className="text-xs text-slate-400 font-bold block mb-1">Початок</label><input type="datetime-local" value={showEdit.startTime} onChange={e=>setShowEdit({...showEdit, startTime: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none" /></div>
                    <div><label className="text-xs text-slate-400 font-bold block mb-1">Повернення</label><input type="datetime-local" value={showEdit.endTime} onChange={e=>setShowEdit({...showEdit, endTime: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none" /></div>
                  </div>
                  <div><label className="text-xs text-slate-400 font-bold block mb-1">Застава</label><input value={showEdit.deposit} onChange={e=>setShowEdit({...showEdit, deposit: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none" /></div>
                  <div><label className="text-xs text-slate-400 font-bold block mb-1">Ціна</label><input type="number" value={showEdit.price} onChange={e=>setShowEdit({...showEdit, price: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none font-bold text-emerald-400" /></div>
                </div>
                <div className="mt-8 flex flex-col-reverse sm:flex-row justify-end gap-3">
                  <button type="button" onClick={()=>setShowEdit(null)} className="w-full sm:w-auto px-5 py-3 rounded-xl font-bold text-slate-400">Скасувати</button>
                  <button type="submit" className="w-full sm:w-auto bg-orange-600 px-6 py-3 rounded-xl font-black text-white">Зберегти Зміни</button>
                </div>
              </form>
            </div>
          )}

          <div>
            <h2 className="text-xl font-black text-white mb-4 flex items-center gap-2"><i data-lucide="flame" className="text-orange-500"></i> Зараз в Прокаті ({activeRentals.length})</h2>
            <div className="space-y-4">
              {activeRentals.map(r => {
                const client = clients.find(c => c.id === r.clientId) || {};
                const rentedBikes = inventory.filter(b => r.bikeIds?.includes(b.id));
                return (
                  <div key={r.id} className="bg-slate-900 p-5 md:p-6 rounded-3xl flex flex-col xl:flex-row justify-between xl:items-center gap-4 md:gap-6 border border-slate-800 hover:border-orange-500/30 transition-colors shadow-lg">
                    <div className="flex items-start gap-4">
                      <div className="hidden sm:block bg-slate-800 p-4 rounded-2xl border border-slate-700"><i data-lucide="bike" className="w-8 h-8 text-orange-400"></i></div>
                      <div>
                        <div className="font-black text-white text-xl mb-1">{rentedBikes.map(b=>b.model).join(', ')}</div>
                        <div className="text-sm font-medium text-slate-300">{client.name} • <span className="font-mono text-slate-400">{client.phone}</span></div>
                        <div className="text-xs text-slate-500 mt-2 font-mono bg-slate-950 inline-block px-2 py-1 rounded">Видано: {new Date(r.startTime).toLocaleString('uk-UA')}</div>
                      </div>
                    </div>
                    <div className="flex flex-wrap md:flex-nowrap gap-3 items-center w-full xl:w-auto">
                      <div className="flex gap-2 w-full md:w-auto">
                        <button onClick={() => printAct(r.id, 'a4')} className="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 px-3 py-3 rounded-xl text-xs font-bold text-white flex justify-center items-center gap-2 transition-colors"><i data-lucide="printer" className="w-4 h-4"></i> Акт А4</button>
                        <button onClick={() => printAct(r.id, 'thermal')} className="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 px-3 py-3 rounded-xl text-xs font-bold text-white flex justify-center items-center gap-2 transition-colors"><i data-lucide="receipt" className="w-4 h-4"></i> Чек</button>
                        <button onClick={() => setShowEdit(r)} className="flex-none bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl text-xs font-bold text-indigo-400 flex justify-center items-center gap-2 transition-colors"><i data-lucide="edit" className="w-4 h-4"></i></button>
                      </div>
                      <button onClick={() => setShowReturn(r.id)} className="w-full md:w-auto bg-rose-600 hover:bg-rose-500 text-white px-8 py-3 rounded-xl font-black shadow-lg shadow-rose-600/30 transition-all flex items-center justify-center gap-2"><i data-lucide="check-square" className="w-5 h-5"></i> Повернути</button>
                    </div>
                  </div>
                );
              })}
              {activeRentals.length === 0 && <div className="text-slate-500 text-center p-12 bg-slate-900/40 rounded-3xl border border-slate-800 border-dashed font-medium">Немає виданого майна. Час знайти клієнтів!</div>}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // ІСТОРІЯ ПРОКАТІВ
    // ==========================================
    function HistoryView({ rentals, clients, inventory, fopData, printDoc }) {
       const [search, setSearch] = useState('');
       const historyRentals = rentals.filter(r => r.status === 'completed').sort((a,b) => new Date(b.actualEndTime) - new Date(a.actualEndTime));

       useEffect(() => { lucide.createIcons(); });

       const filtered = historyRentals.filter(r => {
          const client = clients.find(c => c.id === r.clientId);
          const searchLower = search.toLowerCase();
          return r.id.toLowerCase().includes(searchLower) || (client && client.name.toLowerCase().includes(searchLower));
       });

       const printReturnAct = (rentalId, mode) => {
        const rental = rentals.find(x => x.id === rentalId);
        const client = clients.find(c => c.id === rental.clientId) || {};
        const rentedBikes = inventory.filter(b => rental.bikeIds.includes(b.id));
        
        const contractBase = client.contractType === 'electronic' ? `Публічного договору прокату` : `Договору № П-${String(client.id || '').slice(-4)}`;

        let html = mode === 'a4' ? `
          <div style="text-align: right; font-size: 11px;">Додаток до ${contractBase}</div>
          <h2>АКТ ПОВЕРНЕННЯ МАЙНА № ${rental.id}</h2>
          <p><strong>Час повернення:</strong> ${new Date(rental.actualEndTime).toLocaleString('uk-UA')}</p>
          <p>Орендодавець (${fopData.name}) прийняв, а Орендар (${client.name}) повернув наступне майно:</p>
          <table>
            <tr><th>Транспорт</th><th>Серійний №</th></tr>
            ${rentedBikes.map(b => `<tr><td>${b.type} ${b.model}</td><td>${b.serial}</td></tr>`).join('')}
          </table>
          <p><strong>Стан при поверненні:</strong> ${rental.damageNote || 'Майно повернуто у належному стані. Претензії відсутні.'}</p>
          ${rental.fine > 0 ? `<p><strong>Нараховано штраф/доплату:</strong> ${rental.fine} грн</p>` : ''}
          <div class="no-break">
            <table class="no-border-table" style="margin-top: 40px;">
              <tr>
                <td style="width: 50%;"><b>Прийняв:</b><br/><br/>_________</td>
                <td style="width: 50%; text-align: right;"><b>Здав:</b><br/><br/>_________</td>
              </tr>
            </table>
          </div>
        ` : `
          <h3 class="center">АКТ ПОВЕРНЕННЯ</h3>
          <div class="center" style="margin-bottom: 5px;">№ ${rental.id}</div>
          <div>Клієнт: ${client.name}</div>
          <div>Час:<br/>${new Date(rental.actualEndTime).toLocaleString('uk-UA').replace(',', '')}</div>
          <hr/>
          ${rentedBikes.map(b => `<div class="bold">${b.model}</div>`).join('')}
          <hr/>
          <div>Стан: ${rental.damageNote || 'ОК (без претензій)'}</div>
          <div class="bold" style="margin-top: 3px;">Штраф: ${rental.fine || 0} ₴</div>
          <hr/>
          <br/>
          <div>Здав: _________</div>
          <br/>
          <div>Прийняв: ________</div>
        `;
        printDoc(html, mode);
      };

       return (
          <div className="max-w-6xl mx-auto space-y-6">
             <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl">
                <div><h1 className="text-3xl font-black text-white">Історія Прокатів</h1><p className="text-slate-400 mt-1">Архів закритих оренд та актів повернення</p></div>
             </div>
             
             <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Пошук за номером Акту або іменем клієнта..." className="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-white outline-none focus:border-orange-500 transition-colors" />

             <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-x-auto shadow-xl">
                <table className="w-full text-left text-sm min-w-[700px]">
                   <thead className="bg-slate-950 text-slate-400"><tr><th className="p-4 md:p-5 font-bold">Акт / Час</th><th className="p-4 md:p-5 font-bold">Клієнт / Майно</th><th className="p-4 md:p-5 font-bold">Фінанси / Стан</th><th className="p-4 md:p-5 text-right font-bold">Друк Актів</th></tr></thead>
                   <tbody className="divide-y divide-slate-800/50">
                      {filtered.map(r => {
                         const client = clients.find(c => c.id === r.clientId) || {};
                         const bikes = inventory.filter(b => r.bikeIds?.includes(b.id)).map(b=>b.model).join(', ');
                         return (
                            <tr key={r.id} className="hover:bg-slate-800/40 transition-colors">
                               <td className="p-4 md:p-5"><div className="font-mono text-white font-bold">{r.id}</div><div className="text-xs text-slate-400">{new Date(r.actualEndTime).toLocaleDateString('uk-UA')}</div></td>
                               <td className="p-4 md:p-5"><div className="font-bold text-white">{client.name}</div><div className="text-xs text-slate-400">{bikes}</div></td>
                               <td className="p-4 md:p-5">
                                  <div className="text-emerald-400 font-bold mb-1">Оплата: {r.price} ₴</div>
                                  {r.fine > 0 && <div className="text-rose-400 font-bold text-xs">Штраф: {r.fine} ₴</div>}
                                  {r.damageNote && <div className="text-slate-400 text-xs mt-1 italic">"{r.damageNote}"</div>}
                               </td>
                               <td className="p-4 md:p-5 text-right flex justify-end gap-2">
                                  <button onClick={() => printReturnAct(r.id, 'a4')} className="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold text-white transition-colors">А4</button>
                                  <button onClick={() => printReturnAct(r.id, 'thermal')} className="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold text-white transition-colors">Чек</button>
                               </td>
                            </tr>
                         )
                      })}
                      {filtered.length === 0 && <tr><td colSpan="4" className="p-10 text-center text-slate-500 font-medium">Історія порожня.</td></tr>}
                   </tbody>
                </table>
             </div>
          </div>
       );
    }

    // ==========================================
    // БАЗА КЛІЄНТІВ 
    // ==========================================
    function ClientsView({ clients, setClients, fopData, printDoc, saveToDB, showToast }) {
      const [showAdd, setShowAdd] = useState(false);
      const [showEdit, setShowEdit] = useState(null);
      const [c, setC] = useState({ name: '', phone: '', docType: 'Паспорт (ID картка)', docNumber: '', contractType: 'electronic', contractLink: '', docIssuedBy: '', address: '' });
      const [search, setSearch] = useState('');

      useEffect(() => { lucide.createIcons(); });

      const handleSave = (e) => { 
         e.preventDefault(); 
         if(showEdit) {
            setClients(clients.map(cl => cl.id === c.id ? c : cl));
            saveToDB('update_client', c);
            showToast('Клієнта оновлено!');
            setShowEdit(null);
         } else {
            const newId = Date.now().toString();
            const newClient = { ...c, id: newId };
            setClients([newClient, ...clients]);
            saveToDB('save_client', newClient);
            showToast('Клієнта додано!');
            setShowAdd(false); 
         }
      };

      const openEdit = (client) => { setC(client); setShowEdit(true); setShowAdd(false); };
      const openAdd = () => { setC({ name: '', phone: '', docType: 'Паспорт (ID картка)', docNumber: '', contractType: 'electronic', contractLink: '', docIssuedBy: '', address: '' }); setShowAdd(true); setShowEdit(null); };
      
      const printContract = (client) => {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear());
        const dateStr = `«${day}» ${month} ${year} р.`;
        
        const num = `П-${String(client.id || '').slice(-4)}`;
        
        const html = `
          <h1>ДОГОВІР ПРОКАТУ ТРАНСПОРТНИХ ЗАСОБІВ № ${num}</h1>
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold;">
            <span>м. Черкаси</span>
            <span>${dateStr}</span>
          </div>
          
          <p><strong>${fopData.name}</strong>, РНОКПП ${fopData.rnokpp}, (надалі — «Орендодавець»), та Громадянин(ка) <strong>${client.name}</strong>, документ: <strong>${client.docType} ${client.docNumber}</strong>, виданий: ${client.docIssuedBy}, адреса: ${client.address} (надалі — «Орендар»), уклали цей Договір про наступне:</p>
          
          <h2>1. ПРЕДМЕТ ДОГОВОРУ</h2>
          <p>1.1. Орендодавець зобов'язується передати Орендарю у тимчасове платне користування рухоме майно — транспортний засіб (велосипеди, електросамокати тощо, надалі — «Майно»), а Орендар зобов'язується прийняти його, оплатити прокат та повернути у справному стані.</p>
          <p>1.2. Цей Договір є рамковим. Конкретні деталі кожної оренди (модель, ціна, оголошена вартість, застава) фіксуються в Актах приймання-передачі, які є невід'ємними частинами цього Договору.</p>
          
          <h2>2. ОБОВ'ЯЗКОВИЙ ОГЛЯД ТА ПОРЯДОК ПЕРЕДАЧІ</h2>
          <p>2.1. Передача та повернення Майна оформлюється Актом приймання-передачі.</p>
          <p>2.2. ОБОВ'ЯЗКОВИЙ ОГЛЯД: До моменту підписання Акту та початку руху Орендар ЗОБОВ'ЯЗАНИЙ особисто перевірити технічний стан Майна, а саме: справність та надійність гальм, відсутність люфту руля, достатній тиск у шинах, рівень заряду акумулятора, відсутність видимих механічних пошкоджень.</p>
          <p>2.3. Якщо Орендар виявив недоліки, він зобов'язаний негайно повідомити про це Орендодавця до початку користування для заміни Майна.</p>
          <p>2.4. ЮРИДИЧНИЙ НАСЛІДОК ОГЛЯДУ: Підписання Акту та/або початок руху означає, що Орендар провів належний огляд, переконався у повній справності Майна та не має жодних претензій. Орендодавець звільняється від будь-якої відповідальності за шкоду або ДТП, що виникли внаслідок технічних несправностей, які Орендар міг і повинен був виявити під час цього первинного огляду.</p>

          <h2>3. ПРАВА, ОБОВ'ЯЗКИ ТА ЗАБОРОНИ</h2>
          <p>3.1. Орендар зобов'язаний неухильно дотримуватися Правил дорожнього руху (ПДР) України та Додатка №1 до цього Договору.</p>
          <p>3.2. Орендарю СУВОРО ЗАБОРОНЯЄТЬСЯ: керувати Майном у стані алкогольного, наркотичного або іншого сп'яніння; виконувати стрибки, трюки; передавати Майно третім особам (включаючи неповнолітніх дітей без супроводу); залишати Майно без нагляду не пристебнутим надійним замком; перевищувати допустиме навантаження.</p>

          <h2>4. ВІДПОВІДАЛЬНІСТЬ ТА ЗВІЛЬНЕННЯ ВІД ВІДПОВІДАЛЬНОСТІ</h2>
          <p>4.1. Орендар бере на себе ПОВНУ ТА ОДНООСІБНУ відповідальність за своє життя, фізичне та психічне здоров'я під час управління Майном.</p>
          <p>4.2. Орендодавець не несе жодної відповідальності за травми, шкоду життю, здоров'ю або майну Орендаря, а також за будь-яку шкоду, завдану Орендарем третім особам. Будь-які претензії третіх осіб Орендар врегульовує самостійно та за власний рахунок.</p>
          <p>4.3. Орендар самостійно оплачує всі штрафи за порушення ПДР.</p>
          <p>4.4. У разі пошкодження Майна Орендар відшкодовує вартість ремонту та запчастин протягом 3 днів.</p>
          <p>4.5. ВІДШКОДУВАННЯ ЗА ВТРАТУ: У разі крадіжки, втрати або повного (незворотного) знищення Майна, Орендар зобов'язаний виплатити Орендодавцю Оголошену вартість Майна (вказану в Акті) протягом 3 (трьох) календарних днів з моменту настання події.</p>

          <h2>5. ГАРАНТІЙНА ЗАСТАВА</h2>
          <p>5.1. Наявність та вид застави (грошові кошти або документ) фіксується в Акті.</p>
          <p>5.2. Застава повертається після повернення Майна у справному стані. Орендодавець має право утримати із застави кошти на ремонт або штраф за порушення умов оренди.</p>

          <h2>6. ФОРС-МАЖОР ТА ВОЄННИЙ СТАН</h2>
          <p>6.1. Сторони звільняються від відповідальності за невиконання зобов'язань, якщо це сталося внаслідок дії непереборної сили. Пошкодження або крадіжка Майна третіми особами під час оренди не є форс-мажором і не звільняє Орендаря від обов'язку відшкодувати збитки Орендодавцю згідно з п. 4.5. Введення воєнного стану не є підставою для звільнення від матеріальної відповідальності.</p>

          <div class="no-break">
            <p style="margin-top: 15px;">Підписуючи цей договір Орендар підтверджує, що він пройшов Інструктаж (Додаток №1), розуміє правила техніки безпеки та зобов'язується їх неухильно виконувати.</p>
            <table class="no-border-table" style="margin-top: 30px;">
              <tr>
                <td style="width: 50%; vertical-align: top;">
                  <strong>ОРЕНДОДАВЕЦЬ</strong><br/>${fopData.name}<br/>ІПН: ${fopData.rnokpp}<br/>Адреса: ${fopData.address}<br/>Тел: ${fopData.phone}<br/><br/>Підпис: _________________
                </td>
                <td style="width: 50%; vertical-align: top;">
                  <strong>ОРЕНДАР</strong><br/>${client.name}<br/>Документ: ${client.docType} ${client.docNumber}<br/>Тел: ${client.phone}<br/>Адреса: ${client.address}<br/><br/>Підпис: _________________
                </td>
              </tr>
            </table>
          </div>

          <div class="page-break"></div>
          <h2>ДОДАТОК № 1 до Договору прокату № ${num}</h2>
          <h3>ІНСТРУКТАЖ З ТЕХНІКИ БЕЗПЕКИ ПРИ КОРИСТУВАННІ ТРАНСПОРТОМ</h3>
          <p>Цей Інструктаж є обов'язковим до виконання. Недотримання цих правил може призвести до травм та матеріальної відповідальності.</p>
          
          <p><strong>Розділ 1. Загальні правила для всіх видів транспорту</strong></p>
          <ul>
            <li>Орендар зобов'язаний знати та дотримуватися Правил дорожнього руху (ПДР) України.</li>
            <li>Перетин пішохідних переходів: Наближаючись до пішохідного переходу (зебри), Орендар ЗОБОВ'ЯЗАНИЙ спішитися (злізти з транспорту) і перевести його в руках. Їзда по пішохідному переходу КАТЕГОРИЧНО ЗАБОРОНЕНА.</li>
            <li>Орендодавець настійно рекомендує використовувати захисний шолом та засоби захисту під час руху. Відмова від використання засобів захисту є особистим ризиком Орендаря.</li>
            <li>Забороняється користуватися мобільним телефоном (тримати його в руці) та слухати музику в навушниках під час руху.</li>
            <li>Забороняється їзда в темну пору доби без увімкнених передніх фар (ліхтарів) та задніх світловідбивачів/мигалок.</li>
          </ul>

          <p><strong>Розділ 2. Спеціальні правила для Велосипедів</strong></p>
          <ul>
            <li>Рух по проїзній частині дозволяється особам, які досягли 14-річного віку.</li>
            <li>Рух на велосипеді має здійснюватися по крайній правій смузі проїзної частини, велодоріжках або велосмугах.</li>
            <li>Перед маневруванням (поворот, зупинка) Орендар зобов'язаний подавати попереджувальні сигнали рукою згідно з ПДР.</li>
            <li>Забороняється їздити, не тримаючись за кермо хоча б однією рукою, та перевозити пасажирів на багажнику або рамі.</li>
          </ul>

          <p><strong>Розділ 3. Спеціальні правила для Електросамокатів та Електровелосипедів</strong></p>
          <ul>
            <li>Електротранспорт має високу динаміку розгону. Орендар зобов'язаний плавно натискати на ручку/кнопку газу, уникаючи різких ривків, щоб не втратити рівновагу.</li>
            <li>Їзда вдвох суворо заборонена! Електросамокат розрахований виключно на ОДНУ особу. Перевищення навантаження призводить до поломки механізму складання та рами (вартість ремонту відшкодовує Орендар).</li>
            <li>При русі по тротуарах (якщо це не заборонено місцевими правилами) ПІШОХОДИ МАЮТЬ БЕЗУМОВНУ ПЕРЕВАГУ. Орендар зобов'язаний знизити швидкість до швидкості пішохода (не більше 5-7 км/год) при наближенні до людей.</li>
            <li>Забороняється заїжджати в глибокі калюжі або використовувати електротранспорт під час сильної зливи (ризик замикання батареї).</li>
            <li>З'їзд з бордюрів на електросамокаті заборонений. Транспорт необхідно зупинити та акуратно спустити руками, щоб уникнути пошкодження батареї, яка знаходиться в деці (платформі).</li>
          </ul>
        `;
        printDoc(html, 'a4');
      };

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl gap-4">
            <div><h1 className="text-3xl font-black text-white">База Клієнтів</h1></div>
            <button onClick={openAdd} className="w-full md:w-auto bg-indigo-600 hover:bg-indigo-500 px-6 py-3.5 rounded-xl font-bold flex justify-center items-center gap-2 text-white shadow-lg transition-all"><i data-lucide="user-plus" className="w-5 h-5"></i> Новий клієнт</button>
          </div>
          
          {(showAdd || showEdit) && (
            <form onSubmit={handleSave} className="bg-slate-900 border border-slate-700 p-5 md:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95 duration-200">
              <h2 className="text-xl font-bold text-white mb-6">{showEdit ? 'Редагування Клієнта' : 'Реєстрація Клієнта'}</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                <div className="md:col-span-2 flex flex-col sm:flex-row gap-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                  <label className={`flex-1 flex justify-center items-center gap-2 p-3 rounded-lg cursor-pointer font-bold transition-colors ${c.contractType==='electronic' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><input type="radio" className="hidden" checked={c.contractType==='electronic'} onChange={()=>setC({...c, contractType: 'electronic'})}/> <i data-lucide="smartphone" className="w-4 h-4"></i> Е-Оферта</label>
                  <label className={`flex-1 flex justify-center items-center gap-2 p-3 rounded-lg cursor-pointer font-bold transition-colors ${c.contractType==='paper' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><input type="radio" className="hidden" checked={c.contractType==='paper'} onChange={()=>setC({...c, contractType: 'paper'})}/> <i data-lucide="scroll-text" className="w-4 h-4"></i> Паперовий</label>
                </div>
                <input required value={c.name} onChange={e=>setC({...c, name: e.target.value})} placeholder="ПІБ Клієнта" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-indigo-500" />
                <input required value={c.phone} onChange={e=>setC({...c, phone: e.target.value})} placeholder="Телефон" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-indigo-500" />
                <select value={c.docType} onChange={e=>setC({...c, docType: e.target.value})} className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-indigo-500"><option>Паспорт (ID картка)</option><option>Паспорт (книжечка)</option><option>Закордонний</option></select>

                  <button type="submit" className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 px-8 py-3 rounded-xl font-black text-white shadow-lg shadow-indigo-600/30">Зберегти Клієнта</button>

              <tbody className="divide-y divide-slate-800/50">
                {clients.filter(cl => cl.name.toLowerCase().includes(search.toLowerCase()) || cl.phone.includes(search)).map(cl => (
                  <tr key={cl.id} className="hover:bg-slate-800/40 transition-colors">
                    <td className="p-4 md:p-5 font-bold text-white text-base">{cl.name}</td>
                    <td className="p-4 md:p-5 text-slate-400 font-mono">{cl.phone}<br/><span className="text-xs font-sans text-slate-500">{cl.docType} {cl.docNumber}</span></td>

                    <td className="p-4 md:p-5 text-right flex justify-end items-center gap-2 md:gap-3">
                      {cl.contractType === 'paper' && <button onClick={()=>printContract(cl)} className="text-amber-400 bg-amber-500/10 hover:bg-amber-500 hover:text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 border border-amber-500/20"><i data-lucide="printer" className="w-4 h-4"></i> Друк</button>}
                      {cl.contractType === 'electronic' && cl.contractLink && <a href={cl.contractLink} target="_blank" className="text-indigo-400 bg-indigo-500/10 hover:bg-indigo-500 hover:text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 border border-indigo-500/20"><i data-lucide="external-link" className="w-4 h-4"></i> Лінк</a>}
                      <button onClick={()=>openEdit(cl)} className="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors"><i data-lucide="edit" className="w-5 h-5"></i></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
