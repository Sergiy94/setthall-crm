    function InventoryView({ inventory, setInventory, saveToDB, showToast }) {
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [item, setItem] = useState({ id: '', type: 'Велосипед', model: '', serial: '', value: '', condition: 'Справний' });

      useEffect(() => { lucide.createIcons(); });

      const handleSave = (e) => {
        e.preventDefault();
        if (editingId) {
          const ub = { ...item, status: inventory.find(i=>i.id===editingId).status };
          setInventory(inventory.map(i => i.id === editingId ? ub : i));
          saveToDB('update_inventory', ub);
          showToast('Транспорт оновлено!');
        } else {
          const ni = { ...item, status: 'available' };
          setInventory([ni, ...inventory]);
          saveToDB('save_inventory', ni);
          showToast('Транспорт додано!');
        }
        setShowForm(false);
        setEditingId(null);
      };

      const openEdit = (i) => { setItem(i); setEditingId(i.id); setShowForm(true); };

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl gap-4">
            <div><h1 className="text-3xl font-black text-white">Парк Транспорту</h1></div>
            <button onClick={() => { setShowForm(!showForm); setEditingId(null); setItem({ id: '', type: 'Велосипед', model: '', serial: '', value: '', condition: 'Справний' }); }} className="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 px-6 py-3.5 rounded-xl font-bold flex justify-center items-center gap-2 text-white shadow-lg shadow-emerald-600/30 transition-all"><i data-lucide="plus" className="w-5 h-5"></i> Додати майно</button>
          </div>

          {showForm && (
            <form onSubmit={handleSave} className="bg-slate-900 border border-slate-700 p-6 md:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95 duration-200">
               <h2 className="text-xl font-bold text-white mb-6">{editingId ? 'Редагування Майна' : 'Нове Майно'}</h2>
               <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-5">
                 <input required value={item.id} onChange={e=>setItem({...item, id: e.target.value})} placeholder="Бортовий № (напр. V-001)" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-emerald-500" disabled={!!editingId} />
                 <select value={item.type} onChange={e=>setItem({...item, type: e.target.value})} className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-emerald-500"><option>Велосипед</option><option>Електросамокат</option><option>Аксесуар</option></select>
                 <input required value={item.model} onChange={e=>setItem({...item, model: e.target.value})} placeholder="Модель" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-emerald-500" />
                 <input required value={item.serial} onChange={e=>setItem({...item, serial: e.target.value})} placeholder="Серійний номер (VIN)" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-emerald-500" />
                 <input required type="number" value={item.value} onChange={e=>setItem({...item, value: e.target.value})} placeholder="Оголошена вартість (грн)" className="bg-rose-950/20 border-2 border-rose-900/50 p-3.5 md:p-4 rounded-xl text-rose-400 font-bold outline-none focus:border-rose-500" />
                 <input required value={item.condition} onChange={e=>setItem({...item, condition: e.target.value})} placeholder="Технічний стан" className="bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-emerald-500" />
                 <div className="md:col-span-3 flex flex-col-reverse sm:flex-row justify-end gap-3 mt-4">
                   <button type="button" onClick={()=>setShowForm(false)} className="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">Скасувати</button>
                   <button type="submit" className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-black text-white shadow-lg shadow-emerald-600/30">Зберегти в базу</button>
                 </div>
               </div>
            </form>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
            {inventory.map(i => (
              <div key={i.id} className="bg-slate-900 p-6 rounded-3xl relative border border-slate-800 hover:border-slate-700 transition-colors shadow-lg">
                <div className={`absolute top-0 right-0 w-2 h-full ${i.status === 'available' ? 'bg-emerald-500' : 'bg-rose-500'} rounded-r-3xl`}></div>
                <div className="flex justify-between items-center mb-3">
                   <span className="text-xs font-mono font-bold bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-300">{i.id}</span>
                   <span className={`text-[10px] uppercase font-black tracking-wider px-3 py-1 rounded-full ${i.status === 'available' ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10'}`}>{i.status === 'available' ? 'Вільний' : 'В оренді'}</span>
                </div>
                <h3 className="font-black text-xl text-white mb-1">{i.model}</h3>
                <p className="text-xs font-medium text-slate-400 uppercase tracking-wide">{i.type} • SN: {i.serial}</p>
                <div className="mt-5 pt-4 border-t border-slate-800 flex justify-between items-center">
                  <div>
                     <div className="text-[10px] uppercase font-bold text-slate-500 mb-0.5">Оголошена Вартість</div>
                     <div className="font-black text-rose-400 text-lg">{i.value} ₴</div>
                  </div>
                  <button onClick={() => openEdit(i)} className="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-slate-300 transition-colors"><i data-lucide="edit-3" className="w-5 h-5"></i></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // НАЛАШТУВАННЯ ТА ГЕНЕРАЦІЯ Е-ДОГОВОРУ
    // ==========================================
    function SettingsView({ fopData, setFopData, apiCall, showToast }) {
       const contentRef = useRef(null);

       useEffect(() => { lucide.createIcons(); });

       const handleSave = async (e) => {
          e.preventDefault();
          try {
            await apiCall({ action: 'save_settings', settings: fopData });
            showToast('Реквізити збережено!');
          } catch (e) {
            showToast('Помилка збереження!', 'error');
          }
       };

       const generatePDF = () => {
          showToast('Генерація PDF... Зачекайте');
          const element = contentRef.current;
          element.style.display = 'block';
          
          html2canvas(element, { scale: 2, useCORS: true }).then((canvas) => {
             const imgData = canvas.toDataURL('image/jpeg', 1.0);
             const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
             const pdfWidth = pdf.internal.pageSize.getWidth();
             const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
             
             let heightLeft = pdfHeight;
             let position = 0;
             const pageHeight = pdf.internal.pageSize.getHeight();

             pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, pdfHeight);
             heightLeft -= pageHeight;

             while (heightLeft >= 0) {
                position = heightLeft - pdfHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, pdfHeight);
                heightLeft -= pageHeight;
             }
             
             pdf.save("Public_Contract_SettHall.pdf");
             element.style.display = 'none';
          });
       };

       return (
          <div className="max-w-4xl mx-auto space-y-6">
             <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl">
                <h1 className="text-3xl font-black text-white mb-2">Налаштування</h1>
                <p className="text-slate-400">Реквізити ФОП для автоматичної генерації Актів та Договорів</p>
             </div>
             
             <form onSubmit={handleSave} className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl space-y-5">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                   <div><label className="text-xs font-bold uppercase text-slate-400 mb-2 block">Назва (ФОП...)</label><input required value={fopData.name} onChange={e=>setFopData({...fopData, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                   <div><label className="text-xs font-bold uppercase text-slate-400 mb-2 block">РНОКПП (ІПН)</label><input required value={fopData.rnokpp} onChange={e=>setFopData({...fopData, rnokpp: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                   <div className="md:col-span-2"><label className="text-xs font-bold uppercase text-slate-400 mb-2 block">Юридична Адреса</label><input required value={fopData.address} onChange={e=>setFopData({...fopData, address: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                   <div><label className="text-xs font-bold uppercase text-slate-400 mb-2 block">IBAN</label><input required value={fopData.iban} onChange={e=>setFopData({...fopData, iban: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                   <div><label className="text-xs font-bold uppercase text-slate-400 mb-2 block">Телефон Прокату</label><input required value={fopData.phone} onChange={e=>setFopData({...fopData, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-3.5 md:p-4 rounded-xl text-white outline-none focus:border-orange-500" /></div>
                </div>
                <div className="flex justify-end pt-4"><button type="submit" className="w-full md:w-auto bg-orange-600 hover:bg-orange-500 px-8 py-3.5 rounded-xl font-black text-white shadow-lg shadow-orange-600/30 flex justify-center items-center gap-2"><i data-lucide="save" className="w-5 h-5"></i> Зберегти Реквізити</button></div>
             </form>

             <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                   <h2 className="text-xl font-bold text-white mb-1">Публічна Оферта (Е-Договір)</h2>
                   <p className="text-sm text-slate-400">Створити PDF файл публічного договору для підписання клієнтами через Paperless або Вчасно.</p>
                </div>
                <button onClick={generatePDF} className="bg-indigo-600 hover:bg-indigo-500 w-full md:w-auto px-6 py-4 rounded-xl font-bold text-white flex justify-center items-center gap-2 shadow-lg transition-colors"><i data-lucide="file-down" className="w-5 h-5"></i> Скачати PDF Договір</button>
             </div>

             {/* ПРИХОВАНИЙ ШАБЛОН ДЛЯ PDF (ОФЕРТА) */}
             <div className="print-only" ref={contentRef} style={{ width: '210mm', padding: '20mm 20mm 25mm 20mm', backgroundColor: 'white', color: 'black', fontFamily: 'Times New Roman, serif', fontSize: '13px', lineHeight: '1.5', textAlign: 'justify' }}>
                <h1 style={{ textAlign: 'center', fontSize: '16px', fontWeight: 'bold', marginBottom: '20px' }}>ПУБЛІЧНИЙ ДОГОВІР ПРОКАТУ ТРАНСПОРТНИХ ЗАСОБІВ<br/>(ОФЕРТА)</h1>
                <p><strong>1. ЗАГАЛЬНІ ПОЛОЖЕННЯ ТА ПОРЯДОК АКЦЕПТУ</strong><br/>
                1.1. Цей документ є відкритою пропозицією (Офертою) ${fopData.name}, що діє на підставі Виписки з ЄДРПОУ (надалі — «Орендодавець»), укласти Договір прокату транспортних засобів (надалі — «Договір») з будь-якою фізичною особою (надалі — «Орендар»).<br/>
                1.2. Відповідно до ст. 633, 634, 641, 642 Цивільного кодексу України, цей Договір є публічним договором приєднання. Його умови є однаковими для всіх Орендарів.<br/>
                1.3. АКЦЕПТ (ПРИЙНЯТТЯ) ДОГОВОРУ: Цей Договір не потребує двостороннього підписання на папері. Беззаперечним та повним прийняттям (акцептом) умов цього Договору та Додатка №1 до нього (Інструктаж з техніки безпеки) є накладення Орендарем свого електронного підпису (КЕП/УЕП/Дія.Підпис) на цей документ у системі електронного документообігу, АБО підписання Орендарем паперового/електронного Акту приймання-передачі, що містить посилання на цей Договір.<br/>
                1.4. Цей Договір є рамковим. Конкретні деталі кожної оренди (модель, ціна, оголошена вартість, застава) фіксуються в Актах приймання-передачі, які є невід'ємними частинами цього Договору.</p>

                <p><strong>2. ПРЕДМЕТ ДОГОВОРУ</strong><br/>
                2.1. Орендодавець зобов'язується передати Орендарю у тимчасове платне користування рухоме майно — транспортний засіб (велосипеди, електросамокати тощо, надалі — «Майно»), а Орендар зобов'язується прийняти його, оплатити прокат та повернути у справному стані.</p>

                <p><strong>3. ОБОВ'ЯЗКОВИЙ ОГЛЯД ТА ПОРЯДОК ПЕРЕДАЧІ</strong><br/>
                3.1. Передача та повернення Майна оформлюється Актом приймання-передачі.<br/>
                3.2. ОБОВ'ЯЗКОВИЙ ОГЛЯД: До моменту підписання Акту та початку руху Орендар ЗОБОВ'ЯЗАНИЙ особисто перевірити технічний стан Майна, а саме: справність та надійність передніх і задніх гальм, відсутність люфту руля та надійність його кріплення, достатній тиск у шинах та відсутність пошкоджень покришок, рівень заряду акумулятора (для електротранспорту), відсутність видимих механічних пошкоджень рами чи інших вузлів.<br/>
                3.3. Якщо Орендар виявив недоліки, він зобов'язаний негайно повідомити про це Орендодавця до початку користування для заміни Майна.<br/>
                3.4. ЮРИДИЧНИЙ НАСЛІДОК ОГЛЯДУ: Підписання Акту та/або початок руху означає, що Орендар провів належний огляд, переконався у повній справності Майна та не має жодних претензій. Орендодавець звільняється від будь-якої відповідальності за шкоду або ДТП, що виникли внаслідок технічних несправностей, які Орендар міг і повинен був виявити під час цього первинного огляду.</p>

                <p><strong>4. ПРАВА, ОБОВ'ЯЗКИ ТА ЗАБОРОНИ</strong><br/>
                4.1. Орендар зобов'язаний неухильно дотримуватися Правил дорожнього руху (ПДР) України та Додатка №1 до цього Договору.<br/>
                4.2. Орендарю СУВОРО ЗАБОРОНЯЄТЬСЯ: 4.2.1. Керувати Майном у стані алкогольного, наркотичного або іншого сп'яніння. 4.2.2. Виконувати стрибки, трюки, їздити по сходах або використовувати Майно в екстремальних умовах, не передбачених інструкцією виробника. 4.2.3. Передавати Майно третім особам (включаючи неповнолітніх дітей без супроводу). 4.2.4. Залишати Майно без нагляду не пристебнутим надійним замком до стаціонарних об'єктів. 4.2.5. Перевищувати допустиме навантаження (вагу), вказане для конкретного типу Майна.</p>

                <p><strong>5. ВІДПОВІДАЛЬНІСТЬ ТА ЗВІЛЬНЕННЯ ВІД ВІДПОВІДАЛЬНОСТІ</strong><br/>
                5.1. Орендар бере на себе ПОВНУ ТА ОДНООСІБНУ відповідальність за своє життя, фізичне та психічне здоров'я під час управління Майном.<br/>
                5.2. Орендодавець не несе жодної відповідальності за травми, шкоду життю, здоров'ю або майну Орендаря, а також за будь-яку шкоду, завдану Орендарем третім особам (пішоходам, автомобілям тощо) під час оренди. Будь-які претензії третіх осіб Орендар врегульовує самостійно та за власний рахунок.<br/>
                5.3. Орендар самостійно оплачує всі штрафи за порушення ПДР.<br/>
                5.4. У разі пошкодження Майна Орендар відшкодовує вартість ремонту та запчастин протягом 3 днів.<br/>
                5.5. ВІДШКОДУВАННЯ ЗА ВТРАТУ: У разі крадіжки, втрати або повного (незворотного) знищення Майна, Орендар зобов'язаний виплатити Орендодавцю Оголошену вартість Майна (вказану в Акті) протягом 3 (трьох) календарних днів з моменту настання події.</p>

                <p><strong>6. ГАРАНТІЙНА ЗАСТАВА</strong><br/>
                6.1. Наявність та вид застави (грошові кошти або документ) фіксується в Акті.<br/>
                6.2. Застава повертається після повернення Майна у справному стані. Орендодавець має право утримати із застави кошти на ремонт або штраф за порушення умов оренди.</p>
                
                <p><strong>7. ФОРС-МАЖОР</strong><br/>
                7.1. Сторони звільняються від відповідальності за невиконання зобов'язань, якщо це сталося внаслідок дії непереборної сили (стихійні лиха, війна, рішення органів влади тощо). Пошкодження або крадіжка Майна третіми особами під час оренди не є форс-мажором і не звільняє Орендаря від обов'язку відшкодувати збитки Орендодавцю згідно з п. 5.5.</p>

                <p><strong>8. СТРОК ДІЇ ДОГОВОРУ</strong><br/>
                8.1. Договір діє 1 (один) рік з дати акцепту Орендарем та автоматично пролонгується.</p>

                <p><strong>9. ЮРИДИЧНА СИЛА ЕЛЕКТРОННОГО ДОКУМЕНТООБІГУ</strong><br/>
                9.1. Відповідно до Закону України «Про електронну ідентифікацію та електронні довірчі послуги», Сторони погоджуються, що цей Договір має повну юридичну силу.<br/>
                9.2. Підписи Орендарів збираються та ідентифікуються виключно через систему електронного документообігу. Фактом укладання цього Договору з боку Орендаря є наявність його електронного підпису (або відмітки про акцепт у системі), накладеного на цей електронний документ.<br/>
                9.3. Орендар підтверджує, що до накладення електронного підпису він ознайомився з усіма умовами Договору та Інструктажем (Додаток №1), повністю розуміє їх зміст і згоден з ними.</p>
                
                <h2 style={{ textAlign: 'center', fontSize: '14px', fontWeight: 'bold', marginTop: '30px', pageBreakBefore: 'always' }}>ДОДАТОК №1: ІНСТРУКТАЖ З ТЕХНІКИ БЕЗПЕКИ ПРИ КОРИСТУВАННІ ТРАНСПОРТОМ</h2>
                <p>Цей Інструктаж є обов'язковим до виконання. Недотримання цих правил може призвести до травм та матеріальної відповідальності.</p>
                <p><strong>Розділ 1. Загальні правила для всіх видів транспорту</strong></p>
                <ul style={{ paddingLeft: '20px' }}>
                  <li style={{ marginBottom: '5px' }}>Орендар зобов'язаний знати та дотримуватися Правил дорожнього руху (ПДР) України.</li>
                  <li style={{ marginBottom: '5px' }}>Перетин пішохідних переходів: Наближаючись до пішохідного переходу (зебри), Орендар ЗОБОВ'ЯЗАНИЙ спішитися (злізти з транспорту) і перевести його в руках. Їзда по пішохідному переходу КАТЕГОРИЧНО ЗАБОРОНЕНА.</li>
                  <li style={{ marginBottom: '5px' }}>Орендодавець настійно рекомендує використовувати захисний шолом та засоби захисту під час руху. Відмова від використання засобів захисту є особистим ризиком Орендаря.</li>
                  <li style={{ marginBottom: '5px' }}>Забороняється користуватися мобільним телефоном (тримати його в руці) та слухати музику в навушниках під час руху.</li>
                  <li style={{ marginBottom: '5px' }}>Забороняється їзда в темну пору доби без увімкнених передніх фар (ліхтарів) та задніх світловідбивачів/мигалок.</li>
                </ul>

                <p><strong>Розділ 2. Спеціальні правила для Велосипедів</strong></p>
                <ul style={{ paddingLeft: '20px' }}>
                  <li style={{ marginBottom: '5px' }}>Рух по проїзній частині дозволяється особам, які досягли 14-річного віку.</li>
                  <li style={{ marginBottom: '5px' }}>Рух на велосипеді має здійснюватися по крайній правій смузі проїзної частини, велодоріжках або велосмугах.</li>
                  <li style={{ marginBottom: '5px' }}>Перед маневруванням (поворот, зупинка) Орендар зобов'язаний подавати попереджувальні сигнали рукою згідно з ПДР.</li>
                  <li style={{ marginBottom: '5px' }}>Забороняється їздити, не тримаючись за кермо хоча б однією рукою, та перевозити пасажирів на багажнику або рамі.</li>
                </ul>

                <p><strong>Розділ 3. Спеціальні правила для Електросамокатів та Електровелосипедів</strong></p>
                <ul style={{ paddingLeft: '20px' }}>
                  <li style={{ marginBottom: '5px' }}>Електротранспорт має високу динаміку розгону. Орендар зобов'язаний плавно натискати на ручку/кнопку газу, уникаючи різких ривків, щоб не втратити рівновагу.</li>
                  <li style={{ marginBottom: '5px' }}>Їзда вдвох суворо заборонена! Електросамокат розрахований виключно на ОДНУ особу. Перевищення навантаження призводить до поломки механізму складання та рами (вартість ремонту відшкодовує Орендар).</li>
                  <li style={{ marginBottom: '5px' }}>При русі по тротуарах (якщо це не заборонено місцевими правилами) ПІШОХОДИ МАЮТЬ БЕЗУМОВНУ ПЕРЕВАГУ. Орендар зобов'язаний знизити швидкість до швидкості пішохода (не більше 5-7 км/год) при наближенні до людей.</li>
                  <li style={{ marginBottom: '5px' }}>Забороняється заїжджати в глибокі калюжі або використовувати електротранспорт під час сильної зливи (ризик замикання батареї).</li>
                  <li style={{ marginBottom: '5px' }}>З'їзд з бордюрів на електросамокаті заборонений. Транспорт необхідно зупинити та акуратно спустити руками, щоб уникнути пошкодження батареї, яка знаходиться в деці (платформі).</li>
                </ul>

                <p>Накладаючи електронний підпис на основний Договір або підписуючи Акт приймання-передачі, Орендар підтверджує, що він пройшов цей Інструктаж, розуміє правила техніки безпеки та зобов'язується їх неухильно виконувати.</p>
